<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="720" viewBox="0 0 1000 720" role="img" aria-labelledby="title description">
  <title id="title">From participant comments to a visual-complexity vocabulary</title>
  <desc id="description">Six research stages: select 685 of 698 nonempty comparison records; extract participant wording linked to topics, images, and complexity direction; review passages against the original comments; standardize 404 topic-phrase entries representing 399 distinct phrases; construct a taxonomy of 19 sub-topics within seven topics; and assemble image-linked vocabulary and word and stem tables. Human review is marked at stages three, four, and five.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 1 1 L 9 5 L 1 9 Z" fill="#475569"/>
    </marker>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #172b4d; }
      .heading { font-size: 26px; font-weight: 700; }
      .label { font-size: 22px; font-weight: 700; }
      .body { font-size: 18px; }
      .output-label { font-size: 20px; font-weight: 700; }
      .badge { font-size: 15px; font-weight: 700; fill: #7c4500; }
      .connector { fill: none; stroke: #475569; stroke-width: 2.5; marker-end: url(#arrow); }
      .automatic { fill: #edf4fc; stroke: #527da8; stroke-width: 1.5; }
      .review { fill: #fff6e7; stroke: #b7791f; stroke-width: 1.5; }
      .output { fill: #ecf7f2; stroke: #46846c; stroke-width: 1.5; }
    </style>
  </defs>
  <rect width="1000" height="720" fill="#ffffff"/>
  <text x="500" y="37" text-anchor="middle" class="heading">Visual-complexity comment-processing workflow</text>

  <rect x="70" y="65" width="860" height="78" rx="12" class="automatic"/>
  <text x="95" y="94" class="label">1. Select the comparison records</text>
  <text x="95" y="121" class="body">698 nonempty comparisons -&gt; 685 retained records</text>
  <path d="M 500 143 V 159" class="connector"/>

  <rect x="70" y="161" width="860" height="78" rx="12" class="automatic"/>
  <text x="95" y="190" class="label">2. Extract topics and phrases with AI assistance</text>
  <text x="95" y="217" class="body">Participant wording linked to topics, images, and complexity direction</text>
  <path d="M 500 239 V 255" class="connector"/>

  <rect x="70" y="257" width="860" height="78" rx="12" class="review"/>
  <text x="95" y="286" class="label">3. Review phrases in context</text>
  <rect x="760" y="272" width="145" height="26" rx="13" fill="#fce5bb"/>
  <text x="832" y="290" text-anchor="middle" class="badge">HUMAN REVIEW</text>
  <text x="95" y="313" class="body">Passages checked against participants' comments</text>
  <path d="M 500 335 V 351" class="connector"/>

  <rect x="70" y="353" width="860" height="78" rx="12" class="review"/>
  <text x="95" y="382" class="label">4. Standardize the vocabulary</text>
  <rect x="760" y="368" width="145" height="26" rx="13" fill="#fce5bb"/>
  <text x="832" y="386" text-anchor="middle" class="badge">HUMAN REVIEW</text>
  <text x="95" y="409" class="body">404 topic-phrase entries; 399 distinct curated phrases</text>
  <path d="M 500 431 V 447" class="connector"/>

  <rect x="70" y="449" width="860" height="78" rx="12" class="review"/>
  <text x="95" y="478" class="label">5. Construct the sub-topics</text>
  <rect x="760" y="464" width="145" height="26" rx="13" fill="#fce5bb"/>
  <text x="832" y="482" text-anchor="middle" class="badge">HUMAN REVIEW</text>
  <text x="95" y="505" class="body">19 named sub-topics within 7 broad topics</text>
  <path d="M 500 527 V 543" class="connector"/>

  <rect x="70" y="545" width="860" height="145" rx="12" class="output"/>
  <text x="95" y="577" class="label">6. Assemble image-level and dictionary outputs</text>
  <text x="95" y="618" class="output-label">Image-linked vocabulary</text>
  <text x="95" y="649" class="body">Phrases and concepts linked to images</text>
  <text x="545" y="618" class="output-label">Word and stem tables</text>
  <text x="545" y="649" class="body">Words and related word forms</text>
</svg>
